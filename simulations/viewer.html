  var seg = shrinkSegment(p1, p2, 40);
  var color = arrowColor(info.result);
  var same = !!(lastArrow && lastArrow.from === info.from && lastArrow.to === info.to);
  var prevColor = same ? arrowColor(lastArrow.result) : null;
  line.style.display = 'block';
  line.setAttribute('x1', seg.x1); line.setAttribute('y1', seg.y1);
  line.setAttribute('x2', seg.x2); line.setAttribute('y2', seg.y2);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-dasharray', info.result ? '0' : '10,7');
  if (head) head.setAttribute('fill', color);
  if (G && animate){
    if (!same){
      /* the arrow draws itself from the attacker to the target */
      G.from(line, { attr: { x2: seg.x1, y2: seg.y1 }, duration: .45, ease: 'power2.out' });
    } else if (prevColor !== color){
      /* the ruling lands: the arrow takes its colour with a pulse */
      G.fromTo(line, { attr: { stroke: prevColor, 'stroke-width': 10 } }, { attr: { stroke: color, 'stroke-width': 4 }, duration: .5, ease: 'power2.out' });
      if (head) G.fromTo(head, { attr: { fill: prevColor } }, { attr: { fill: color }, duration: .35 });
    }
  }
  /* while reactions are pending the dashes crawl toward the target */
  if (G && animEnabled && !info.result) G.to(line, { strokeDashoffset: -34, duration: .9, ease: 'none', repeat: -1 });
  lastArrow = info;
}

/* ======================= stage scaling ======================= */
function resizeStage(){
  var wrap = document.getElementById('stage-wrap');
  var stage = document.getElementById('stage');
  if (!wrap || !stage) return;
  var img = imageDims();
  var w = img.w, h = img.h;
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  document.getElementById('stage-bg').style.width = w + 'px';
  document.getElementById('stage-bg').style.height = h + 'px';
  document.getElementById('seats-layer').style.width = w + 'px';
  document.getElementById('seats-layer').style.height = h + 'px';
  document.getElementById('center-layer').style.width = w + 'px';
  document.getElementById('center-layer').style.height = h + 'px';
  var svg = document.getElementById('arrow-svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  var cw = wrap.clientWidth || w;
  var k = cw / w;
  stage.style.transform = 'scale(' + k + ')';
}

/* ======================= layout loading ======================= */
function applyLayoutOverride(json){
  if (json && json.image && json.table && json.card && Array.isArray(json.seats) && json.seats.length === 4){
    LAYOUT = json;
    resizeStage();
    if (events.length) renderAt(currentIndex);
  }
}
function tryLoadLayout(){
  fetch('media/table-layout.json').then(function(r){
    if (!r.ok) throw new Error('no layout');
    return r.json();
  }).then(applyLayoutOverride).catch(function(){ /* file://, missing, or bad JSON: keep the inlined default */ });
}

/* ======================= log ======================= */
function logRowHTML(e, i){
  var turnBadge = '<span class="turn-badge">T' + e.turn + '</span>';
  var kindTag = '<span class="kind-tag">' + escapeHtml(e.kind) + '</span>';
  var cardBtn = '';
  if (e.card_id != null){
    var c = gameData.cards[String(e.card_id)];
    var ch = c ? null : findCharacterById(e.card_id);
    var label = c ? c.name : (ch ? ch.name : ('#' + e.card_id));
    cardBtn = ' <span class="card-ref" data-card="' + e.card_id + '">[' + escapeHtml(label) + ']</span>';
  }
  var extra = '';
  if (e.notes && e.notes !== e.text){
    /* a step's short "why" reads inline; long notes (the whole plan) fold away */
    if (e.kind !== 'plan' && String(e.notes).length <= 160) extra += ' <span class="log-why">— “' + escapeHtml(e.notes) + '”</span>';
    else extra += '<details><summary>notes</summary><div class="detail-body">' + escapeHtml(e.notes) + '</div></details>';
  }
  if (e.kind === 'ruling' && e.data && e.data.question){
    extra += '<details><summary>question</summary><div class="detail-body">' + escapeHtml(e.data.question) + '</div></details>';
  }
  return '<div class="log-row" data-idx="' + i + '">' + turnBadge + kindTag + escapeHtml(e.text || '') + cardBtn + extra + '</div>';
}
function renderLogAll(){
  var list = document.getElementById('log-list');
  var out = [];
  for (var i = 0; i < events.length; i++) out.push(logRowHTML(events[i], i));
  list.innerHTML = out.join('');
}
function renderLogHighlight(idx){
  var prevRows = document.querySelectorAll('.log-row.current');
  for (var k = 0; k < prevRows.length; k++) prevRows[k].classList.remove('current');
  var a = runStart(idx), b = runEnd(idx), first = null;
  for (var i = a; i <= b; i++){
    var row = document.querySelector('.log-row[data-idx="' + i + '"]');
    if (row){ row.classList.add('current'); if (!first) first = row; }
  }
  if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ======================= turn jumper ======================= */
function buildTurnJumper(){
  var wrap = document.getElementById('turn-jumper');
  wrap.innerHTML = '';
  for (var i = 0; i < events.length; i++){
    if (events[i].kind === 'turn_start'){
      (function(idx, turnNum){
        var btn = document.createElement('button');
        btn.className = 'turn-jump-btn';
        btn.textContent = 'T' + turnNum;
        btn.dataset.idx = idx;
        btn.dataset.turn = turnNum;
        btn.addEventListener('click', function(){ renderAt(idx); });
        wrap.appendChild(btn);
      })(i, events[i].turn);
    }
  }
}
function renderTurnJumperHighlight(ev){
  var btns = document.querySelectorAll('.turn-jump-btn');
  for (var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('current', Number(btns[i].dataset.turn) === ev.turn);
  }
}

/* ======================= header ======================= */
function formatResult(r){
  if (!r) return 'in progress';
  var winner = r.winner ? (r.winner === 'tie' ? 'tie' : r.winner + ' wins') : '—';
  var score = '';
  if (r.score && typeof r.score === 'object'){
    var parts = [];
    for (var k in r.score) if (Object.prototype.hasOwnProperty.call(r.score, k)) parts.push(k + ' ' + r.score[k]);
    score = parts.join(' · ');
  }
  return (r.reason ? r.reason + ': ' : '') + winner + (score ? ' (' + score + ')' : '');
}
function renderHeaderStatic(){
  var g = gameData.game || {};
  document.getElementById('hdr-game').innerHTML = '<b>Game ' + escapeHtml(g.id != null ? g.id : '—') + '</b>';
  document.getElementById('hdr-seed').textContent = 'Seed ' + (g.seed != null ? g.seed : '—');
  document.getElementById('hdr-result').textContent = formatResult(g.result);
  var players = Array.isArray(g.players) ? g.players : [];
  document.getElementById('hdr-players').innerHTML = players.map(function(p){
    var faction = p.faction === 'ninja' ? 'ninja' : 'samurai';
    var cname = (p.character && p.character.name) || '?';
    return '<span class="legend-chip ' + faction + '">P' + p.seat + ' ' + escapeHtml(p.name || '') + ' — ' + escapeHtml(cname) + '</span>';
  }).join('');
}
function renderHeaderPosition(ev){
  document.getElementById('hdr-pos').textContent = 'Turn ' + ev.turn + ' · Event ' + (currentIndex + 1) + '/' + events.length;
  var st = ev.state;
  document.getElementById('hdr-deck').textContent = st ? ('Deck ' + st.deck_n + ' · Discard ' + st.discard_n) : '';
}

/* ======================= main render ======================= */
function renderAt(idx, opts){
  if (!events.length) return;
  opts = opts || {};
  idx = Math.max(0, Math.min(idx, events.length - 1));
  var prevIdx = lastIndexShown;
  var ev = events[idx];
  /* one viewing step away → animate the difference; a jump → a quick crossfade */
  var live = hasGsap() && opts.animate !== false && prevIdx >= 0 && prevIdx < events.length && prevIdx !== idx;
  var stepwise = live && isNearStep(prevIdx, idx);
  var before = stepwise ? snapshotScene() : null;
  clearFx();
  currentIndex = idx;
  renderHeaderPosition(ev);
  renderTable(ev);
  renderArrow(idx, stepwise);
  renderExtraArrows(idx, stepwise);
  if (stepwise){
    try { animateTransition(before, ev, events[prevIdx], idx > prevIdx); } catch (err){ clearFx(); }
  } else if (live) crossfadeScene();
  lastIndexShown = idx;
  renderDecisionPanel(idx);
  renderLogHighlight(idx);
  renderTurnJumperHighlight(ev);
  var scrubber = document.getElementById('scrubber');
  if (Number(scrubber.value) !== idx) scrubber.value = idx;
  try { history.replaceState(null, '', location.pathname + location.search + '#e=' + idx); } catch (e) { /* file:// may refuse */ }
}

/* ======================= autoplay ======================= */
function startAutoplay(){
  if (!events.length) return;
  if (currentIndex >= events.length - 1) renderAt(0);
  stopAutoplay();
  autoplayTimer = setInterval(function(){
    if (currentIndex >= events.length - 1){ stopAutoplay(); return; }
    renderAt(stepNext(currentIndex));
  }, Math.max(120, (hasGsap() ? 1500 : 900) / autoplaySpeed));
  document.getElementById('btn-play').textContent = '⏸';
}
function stopAutoplay(){
  if (autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; }
  document.getElementById('btn-play').textContent = '▶';
}
function toggleAutoplay(){
  if (autoplayTimer) stopAutoplay(); else startAutoplay();
}

/* ======================= loading / normalizing ======================= */
function normalizeEvent(e, i){
  e = (e && typeof e === 'object') ? e : {};
  return {
    seq: e.seq != null ? e.seq : i,
    turn: e.turn != null ? e.turn : 0,
    active: e.active != null ? e.active : null,
    kind: e.kind || 'unknown',
    actor: e.actor != null ? e.actor : null,
    target: e.target != null ? e.target : null,
    card: e.card || null,
    card_id: e.card_id != null ? e.card_id : null,
    text: e.text || '',
    data: (e.data && typeof e.data === 'object') ? e.data : {},
    notes: e.notes || null,
    state: (e.state && typeof e.state === 'object') ? e.state : null
  };
}
function normalizeGameData(data){
  data = (data && typeof data === 'object') ? data : {};
  var game = (data.game && typeof data.game === 'object') ? data.game : {};
  var cards = (data.cards && typeof data.cards === 'object') ? data.cards : {};
  var evs = Array.isArray(data.events) ? data.events : [];
  evs = evs.map(normalizeEvent);
  game.players = Array.isArray(game.players) ? game.players.slice() : [];
  for (var i = 0; i < 4; i++){
    if (!game.players[i]){
      game.players[i] = { seat: i, name: 'P' + i, faction: (i % 2 === 0 ? 'samurai' : 'ninja'),
        character: { id: null, name: '?', hp: 1, text: '' } };
    }
  }
  return { game: game, cards: cards, events: evs };
}
function loadGame(data, label){
  try {
    var normalized = normalizeGameData(data);
    if (!normalized.events.length){
      showLoaderMessage('That file has no events to show.');
      return;
    }
    gameData = normalized;
    events = gameData.events;
    currentIndex = 0;
    lastIndexShown = -1; lastArrow = null; lastExtraKeys = {};
    clearFx();
    stopAutoplay();
    document.getElementById('scrubber').max = Math.max(0, events.length - 1);
    renderHeaderStatic();
    buildTurnJumper();
    renderLogAll();
    hideLoader();
    resizeStage();
    /* #e=<index> opens the replay at that event (shareable link to a moment);
       #e=<index>&p=<0..1> freezes the transition into it at that progress (a still of the motion) */
    var m = /(?:^|[#&])e=(\d+)/.exec(location.hash || '');
    var pm = /(?:^|[#&])p=(\d*\.?\d+)/.exec(location.hash || '');
    var target = m ? runEnd(Number(m[1])) : 0;
    if (pm && m && target > 0){
      renderAt(stepPrev(target), { animate: false });
      renderAt(target);
      if (liveTl){ liveTl.pause(); liveTl.seek(Math.max(0, Math.min(1, Number(pm[1]))) * liveTl.duration(), false); }
    } else renderAt(target);
  } catch (err){
    showLoaderMessage('Could not load this game: ' + (err && err.message ? err.message : err));
    showLoader();
  }
}

/* ======================= loader UI ======================= */
function showLoader(){ document.getElementById('loader').style.display = 'flex'; }
function hideLoader(){ document.getElementById('loader').style.display = 'none'; }
function showLoaderMessage(msg){ document.getElementById('loader-msg').textContent = msg || ''; }

function readFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(reader.result);
      loadGame(data, file.name);
    } catch (err){
      showLoaderMessage('That file is not valid JSON: ' + err.message);
    }
  };
  reader.onerror = function(){ showLoaderMessage('Could not read that file.'); };
  reader.readAsText(file);
}
function fetchAndLoad(src){
  showLoaderMessage('Loading ' + src + ' …');
  fetch(src).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data){
    loadGame(data, src);
  }).catch(function(err){
    showLoaderMessage('Could not load "' + src + '": ' + err.message + '. Choose a file instead.');
    showLoader();
  });
}
function populateGameDropdown(games){
  var sel = document.getElementById('game-select');
  var opts = ['<option value="">— choose a game —</option>'];
  for (var i = 0; i < games.length; i++){
    var g = games[i] || {};
    opts.push('<option value="' + escapeHtml(g.file || '') + '">Game ' + escapeHtml(g.id) +
      ' (seed ' + escapeHtml(g.seed) + ', ' + escapeHtml(g.turns_played != null ? g.turns_played : '?') + ' turns)</option>');
  }
  sel.innerHTML = opts.join('');
  sel.style.display = 'inline-block';
  sel.onchange = function(){
    if (sel.value) location.search = '?src=' + encodeURIComponent(sel.value);
  };
  var currentSrc = new URLSearchParams(location.search).get('src');
  if (currentSrc) sel.value = currentSrc;
}
function tryLoadIndex(){
  fetch('games/index.json').then(function(r){
    if (!r.ok) throw new Error('no index');
    return r.json();
  }).then(function(j){
    if (j && Array.isArray(j.games) && j.games.length) populateGameDropdown(j.games);
  }).catch(function(){ /* file://, missing, or no games yet: silently ignore */ });
}

/* ======================= wiring ======================= */
function attachListeners(){
  document.getElementById('decision-toggle').onclick = function(){
    document.getElementById('decision-panel').classList.toggle('collapsed');
  };
  document.getElementById('btn-home').onclick = function(){ stopAutoplay(); renderAt(0); };
  document.getElementById('btn-prev').onclick = function(){ stopAutoplay(); renderAt(stepPrev(currentIndex)); };
  document.getElementById('btn-next').onclick = function(){ stopAutoplay(); renderAt(stepNext(currentIndex)); };
  document.getElementById('btn-end').onclick = function(){ stopAutoplay(); renderAt(events.length - 1); };
  document.getElementById('btn-play').onclick = toggleAutoplay;
  document.getElementById('speed-select').onchange = function(e){
    autoplaySpeed = Number(e.target.value) || 1;
    if (autoplayTimer) startAutoplay();
  };
  document.getElementById('anim-toggle').onchange = function(e){
    animEnabled = !!e.target.checked;
    if (!animEnabled) clearFx();
    if (autoplayTimer) startAutoplay();
  };
  document.getElementById('scrubber').addEventListener('input', function(e){
    stopAutoplay();
    renderAt(runEnd(Number(e.target.value)));
  });

  document.getElementById('log-list').addEventListener('click', function(e){
    if (e.target.closest('[data-card]') || e.target.closest('details')) return;
    var row = e.target.closest('.log-row');
    if (row) { stopAutoplay(); renderAt(runEnd(Number(row.dataset.idx))); }
  });

  document.getElementById('btn-choose').onclick = function(){ document.getElementById('file-input').click(); };
  document.getElementById('file-input').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (f) readFile(f);
  });
  var dropzone = document.getElementById('dropzone');
  ['dragover', 'dragenter'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){ e.preventDefault(); dropzone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){ e.preventDefault(); dropzone.classList.remove('dragover'); });
  });
  dropzone.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  window.addEventListener('resize', resizeStage);

  document.addEventListener('mouseover', function(e){
    if (popoverPinned) return;
    var el = e.target.closest && e.target.closest('[data-card]');
    if (el){
      var id = Number(el.getAttribute('data-card'));
      if (!isNaN(id)) showCardPopover(el, id);
    }
  });
  document.addEventListener('mouseout', function(e){
    if (popoverPinned) return;
    var el = e.target.closest && e.target.closest('[data-card]');
    if (el) hideCardPopover();
  });
  document.addEventListener('click', function(e){
    var el = e.target.closest && e.target.closest('[data-card]');
    if (el){
      var id = Number(el.getAttribute('data-card'));
      if (!isNaN(id)){ popoverPinned = true; showCardPopover(el, id); }
      e.stopPropagation();
      return;
    }
    if (!e.target.closest || !e.target.closest('#card-popover')) hideCardPopover();
  });

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (e.key === 'Escape') hideCardPopover();
      return;
    }
    if (!events.length) return;
    if (e.key === 'ArrowRight'){ stopAutoplay(); renderAt(stepNext(currentIndex)); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ stopAutoplay(); renderAt(stepPrev(currentIndex)); e.preventDefault(); }
    else if (e.key === 'Home'){ stopAutoplay(); renderAt(0); e.preventDefault(); }
    else if (e.key === 'End'){ stopAutoplay(); renderAt(events.length - 1); e.preventDefault(); }
    else if (e.key === ' '){ toggleAutoplay(); e.preventDefault(); }
    else if (e.key === 'Escape'){ hideCardPopover(); }
  });
}

function init(){
  attachListeners();
  resizeStage();
  tryLoadLayout();
  tryLoadIndex();
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  if (src) fetchAndLoad(src);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
