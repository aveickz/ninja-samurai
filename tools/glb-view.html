<!DOCTYPE html>
<!-- Страница-рендерер для tools/render-glb.py: three.js показывает одну .glb-модель
     для скриншота headless Chrome на прозрачном фоне. Параметры в URL:
       src   — путь к .glb (file://), mode — shaded | mesh,
       theta — азимут камеры в градусах (−35), phi — угол от зенита (65),
       wire  — прозрачность рёбер в режиме mesh; по умолчанию падает с числом треугольников.
     Свет — RoomEnvironment + ACES, как «neutral» у model-viewer; кадр — по наибольшему габариту. -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const src = q.get('src'), mode = q.get('mode') || 'shaded';
const theta = THREE.MathUtils.degToRad(parseFloat(q.get('theta') || '-35'));
const phi = THREE.MathUtils.degToRad(parseFloat(q.get('phi') || '65'));
const W = parseInt(q.get('size') || '1200'), H = W;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(1.5, 2.5, 1.2); scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 1e5);
new GLTFLoader().load(src, g => {
  const root = g.scene;
  let tris = 0;
  root.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  // у плотных сеток рёбра сливаются в чёрное — прозрачность линий падает с числом треугольников
  const wireOpacity = parseFloat(q.get('wire') || Math.min(0.65, Math.max(0.1, 0.65 * Math.sqrt(30000 / tris))));
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    if (mode === 'mesh') {
      o.material = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9, metalness: 0,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
      o.add(new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry),
        new THREE.LineBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: wireOpacity })));
    }
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3()), r = Math.max(sz.x, sz.y, sz.z) / 2 * 1.15;
  const d = r / Math.sin(camera.fov / 2 * Math.PI / 180);
  camera.position.set(c.x + d * Math.sin(phi) * Math.sin(theta), c.y + d * Math.cos(phi), c.z + d * Math.sin(phi) * Math.cos(theta));
  camera.near = d / 100; camera.far = d * 10; camera.updateProjectionMatrix(); camera.lookAt(c);
  renderer.render(scene, camera);
  document.title = 'done';
}, undefined, e => { document.title = 'error ' + e; });
</script>
</body></html>
