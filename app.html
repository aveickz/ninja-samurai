<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картотека карточек</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/card.css">
  <link rel="stylesheet" href="styles/comments.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
  <!--
    CMYK soft-proof через Fogra39 ICC.

    Включается двумя способами:
      • ?proof=cmyk в URL (для шаринга ссылки)
      • кнопка «🎨 CMYK preview» в строке фильтров — она тогглит
        тот же режим и обновляет URL через history.replaceState.

    Подключаем proof-cmyk-baked.css — он содержит палитру, прогнанную
    через ICC (sRGB → CMYK → sRGB) реальным lcms-engine'ом.
    Это работает в ЛЮБОМ браузере: внутри обычные #hex значения,
    никакого @color-profile / color() не используется.

    Альтернативный proof-cmyk.css (spec-based, через @color-profile)
    оставлен в репо для будущего, когда браузеры догонят CSS Color 4.
  -->
  <script>
    (function () {
      window.CmykProof = {
        on:  function () { setProof(true);  },
        off: function () { setProof(false); },
        toggle: function () {
          setProof(!document.body.classList.contains('proof-cmyk-baked'));
        },
        isOn: function () {
          return document.body.classList.contains('proof-cmyk-baked');
        }
      };
      function setProof(on) {
        var linkId = 'proof-cmyk-link';
        var existing = document.getElementById(linkId);
        if (on) {
          if (!existing) {
            var link = document.createElement('link');
            link.id = linkId;
            link.rel = 'stylesheet';
            link.href = 'styles/proof-cmyk-baked.css';
            document.head.appendChild(link);
          }
          if (document.body) document.body.classList.add('proof-cmyk-baked');
        } else {
          if (existing) existing.remove();
          if (document.body) document.body.classList.remove('proof-cmyk-baked');
        }
        // Синхронизируем URL — чтобы ссылку можно было шарить
        // и чтобы перезагрузка сохраняла состояние.
        try {
          var url = new URL(location.href);
          if (on)  url.searchParams.set('proof', 'cmyk');
          else     url.searchParams.delete('proof');
          history.replaceState(null, '', url);
        } catch (e) { /* ignore старые браузеры */ }
        // Кнопка-тоггл в фильтр-баре подсветится — app.js слушает
        // событие cmyk-proof-change.
        document.dispatchEvent(new CustomEvent('cmyk-proof-change',
          { detail: { on: on } }));
      }

      // Инициализация: если ?proof=cmyk в URL — включаем сразу.
      if (/[?&]proof=cmyk\b/.test(location.search)) {
        // body ещё может быть не готов — подождём DOMContentLoaded
        if (document.body) setProof(true);
        else document.addEventListener('DOMContentLoaded', function () {
          setProof(true);
        });
      }
    })();
  </script>
</head>
<body>

  <div class="page-top">

    <div class="page-top-left">

      <header class="site-header">
        <h1 data-i18n="h1">Ниндзя против Самураев</h1>
        <p class="subtitle" data-i18n="subtitle">Картотека</p>
        <p class="site-header-links">
          <a class="site-header-link" href="rules/rules.html" target="_blank" rel="noopener" data-i18n="rulesLink" data-i18n-href="rulesHref">📖 Правила игры</a>
          <span class="lang-switch" role="group" aria-label="Language / Язык" data-i18n-title="langTitle">
            <button type="button" class="lang-btn active" data-lang="ru">RU</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </span>
        </p>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-value" id="stat-types"></span>
            <span class="stat-label" data-i18n="statTypes">типов карт</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" id="stat-total"></span>
            <span class="stat-label" data-i18n="statTotal">карт в колоде</span>
          </div>
        </div>
      </header>

      <div class="filter-bar" id="filter-bar"></div>

    </div>

    <aside class="sidebar-stats">
      <p class="sidebar-title" data-i18n="sidebarTitle">Статистика</p>
      <div class="stats-summary">
        <div class="stats-summary-row">
          <span data-i18n="playableTypes">Игровых типов</span>
          <span id="stat-playable-types">—</span>
        </div>
        <div class="stats-summary-row">
          <span data-i18n="playableQty">Игровых карт</span>
          <span id="stat-playable-qty">—</span>
        </div>
        <div class="stats-summary-row stats-summary-row--non-playable">
          <span data-i18n="otherTypes">Неигровых типов</span>
          <span id="stat-other-types">—</span>
        </div>
        <div class="stats-summary-row stats-summary-row--non-playable">
          <span data-i18n="otherQty">Неигровых карт</span>
          <span id="stat-other-qty">—</span>
        </div>
        <div class="stats-summary-row stats-summary-row--non-playable">
          <span data-i18n="trashTypes">🗑 Корзина (типов)</span>
          <span id="stat-trash-types">—</span>
        </div>
      </div>
      <table class="stats-table" id="stats-table">
        <thead>
          <tr>
            <th data-i18n="thGroup">Группа</th>
            <th data-i18n="thTypes" data-i18n-title="thTypesTitle" title="Количество типов карт">Типов</th>
            <th data-i18n="thQty" data-i18n-title="thQtyTitle" title="Количество карт в колоде">Карт</th>
            <th data-i18n="thPct" data-i18n-title="thPctTitle" title="Доля от общего количества карт">%</th>
          </tr>
        </thead>
        <tbody id="stats-table-body"></tbody>
      </table>
    </aside>

  </div>

  <div class="cards-section">
    <p class="section-label"><span data-i18n="sectionLabel">Набор карт</span> <span class="count"></span></p>
    <div class="grid" id="grid"></div>
  </div>

  <!-- База данных карт -->
  <script src="js/cards.js"></script>
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Внешний KV-стор (kvdb.io) -->
  <script src="js/kvdb.js"></script>
  <script>
    // ── Конфиг для комментариев ────────────────────────────────────
    // 1. Создайте bucket: curl -d 'email=YOU@example.com' https://kvdb.io
    //    (один раз; ответ — короткий id, пропишите его ниже).
    // 2. Подтвердите email по ссылке из письма от kvdb.io —
    //    без этого записи блокируются.
    // 3. Опционально: при создании задайте write_key и положите его
    //    в writeKey ниже, иначе bucket будет публичным на запись.
    window.KVDB_CONFIG = {
      bucket:   'YWwXXK5poABCtyxee32wNx',  // например: 'Fd55uogXyxYdnXJvnyN8Xo'
      writeKey: null
    };
  </script>
  <!-- Логика приложения -->
  <script src="js/app.js"></script>
  <!-- Комментарии (после app.js — нужен уже отрисованный #grid) -->
  <script src="js/comments.js"></script>

</body>
</html>
