<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Картотека карточек</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/card.css">
  <link rel="stylesheet" href="styles/comments.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body>

  <div class="page-top">

    <div class="page-top-left">

      <header class="site-header">
        <h1>Ниндзя против Самураев</h1>
        <p class="subtitle">Картотека</p>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-value" id="stat-types"></span>
            <span class="stat-label">типов карт</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" id="stat-total"></span>
            <span class="stat-label">карт в колоде</span>
          </div>
        </div>
      </header>

      <div class="filter-bar" id="filter-bar"></div>

    </div>

    <aside class="sidebar-stats">
      <p class="sidebar-title">Статистика</p>
      <div class="stats-summary">
        <div class="stats-summary-row">
          <span>Типов карт</span>
          <span id="stat-types-live">—</span>
        </div>
        <div class="stats-summary-row">
          <span>Карт в колоде</span>
          <span id="stat-qty-live">—</span>
        </div>
      </div>
      <table class="stats-table" id="stats-table">
        <thead>
          <tr>
            <th>Группа</th>
            <th title="Количество типов карт">Типов</th>
            <th title="Количество карт в колоде">Карт</th>
            <th title="Доля от общего количества карт">%</th>
          </tr>
        </thead>
        <tbody id="stats-table-body"></tbody>
      </table>
    </aside>

  </div>

  <div class="cards-section">
    <p class="section-label">Набор карт <span class="count"></span></p>
    <div class="grid" id="grid"></div>
  </div>

  <!-- База данных карт -->
  <script src="js/cards.js"></script>
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Внешний KV-стор (kvdb.io) -->
  <script src="js/kvdb.js"></script>
  <script>
    // ── Конфиг для комментариев ────────────────────────────────────
    // 1. Создайте bucket: curl -d 'email=YOU@example.com' https://kvdb.io
    //    (один раз; ответ — короткий id, пропишите его ниже).
    // 2. Подтвердите email по ссылке из письма от kvdb.io —
    //    без этого записи блокируются.
    // 3. Опционально: при создании задайте write_key и положите его
    //    в writeKey ниже, иначе bucket будет публичным на запись.
    window.KVDB_CONFIG = {
      bucket:   'YWwXXK5poABCtyxee32wNx',  // например: 'Fd55uogXyxYdnXJvnyN8Xo'
      writeKey: null
    };
  </script>
  <!-- Логика приложения -->
  <script src="js/app.js"></script>
  <!-- Комментарии (после app.js — нужен уже отрисованный #grid) -->
  <script src="js/comments.js"></script>

</body>
</html>
