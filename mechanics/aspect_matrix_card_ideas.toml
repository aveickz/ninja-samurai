# Данные матрицы аспектов: вступление, заключение и идеи новых карт.
# Из этого файла py -3 tools/build-aspect-matrix.py собирает
# aspect_matrix_card_ideas.md и .html — их руками не править.
#
# Поля идеи:
#   id      — номер, на него ссылаются другие файлы (N1…); не перенумеровывать
#   pair    — два ключа из aspects.md: пустое пересечение, которое закрывает идея
#   name/jp — название карты и японское написание
#   group   — группа карты: weapon trap defense stance modifier aoe effect action intervention aura
#   qty     — сколько копий в колоде; tilt — самураи / ниндзя / нейтрально
#   text    — текст карты в микроформате cards.js: {условие}, -ИЛИ-, [NL]
#   flavor  — флавор по правилу №11
#   kin     — id родни в js/cards.js; первая показывается превью в html
#   kin_note — чем идея отличается от родни
#   check   — проверка по мета-правилам
#
# Переделки существующих карт — таблицы [[rework]] в конце файла (R1…):
#   card    — id карты в js/cards.js; «было» генератор берёт оттуда сам
#   becomes — какой станет группа/тип карты
#   text, flavor, check — как у идеи; note — что ещё задевает переделка
# В js/cards.js переделка не вносится, пока её не утвердят.

[doc]
title = "Матрица аспектов — новые карты на пустых пересечениях"
