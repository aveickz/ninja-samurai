<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#2E2A28" fill-rule="evenodd"><title>Приказ</title>
  <!-- Сайхай 采配 — жезл полководца с кистью бумажных полос: им отдавали
       приказ, взмахом указывая, кому и куда идти. Рукоять наклонена, кисть
       веером из пяти полос. Цельный толстый силуэт: бейдж перекрашивается
       в белое CSS-фильтром и живёт на 32 px. Гумбай (веер на рукояти)
       пробовался и на этом размере читался как лупа или ракетка. -->
  <g transform="rotate(-20 50 50)">
    <rect x="45" y="50" width="10" height="47" rx="3"/>
    <path d="M50 52 C30 50 12 40 8 22 C22 30 34 36 44 44 C34 30 30 16 34 2 C42 16 46 30 48 44 L50 4 L52 44 C54 30 58 16 66 2 C70 16 66 30 56 44 C66 36 78 30 92 22 C88 40 70 50 50 52 Z"/>
  </g>
</svg>
