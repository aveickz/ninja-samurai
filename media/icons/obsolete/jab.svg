<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#2E2A28" fill-rule="evenodd"><title>Укол</title>
  <!-- Короткий клинок в выпаде, остриём в правый нижний угол: раны без
       атаки. Силуэт цельный и толстый — бейдж перекрашивается в белое
       CSS-фильтром и живёт на 32 px, тонкие линии там исчезают. -->
  <g transform="rotate(-45 50 50)">
    <!-- навершие -->
    <circle cx="50" cy="9" r="6.5"/>
    <!-- рукоять -->
    <rect x="43.5" y="10" width="13" height="21" rx="3"/>
    <!-- гарда -->
    <rect x="28" y="30" width="44" height="8" rx="4"/>
    <!-- клинок -->
    <path d="M40 38 H60 L50 96 Z"/>
  </g>
  <!-- капля у острия, чуть в стороне от клинка -->
  <path d="M66 82 C66 82 58 91 58 95.5 A8 8 0 0 0 74 95.5 C74 91 66 82 66 82 Z"/>
</svg>
