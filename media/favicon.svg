<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Кабуто — шлем самурая">
  <title>Кабуто</title>

  <!-- Подложка: «оружейный» чёрный из палитры плашек, чтобы иконка
       читалась и на светлой, и на тёмной вкладке браузера. -->
  <rect width="64" height="64" rx="13" fill="#231F20"/>

  <!-- Сикоро (𩊱) — назатыльник, расходящийся книзу. Самая широкая
       часть силуэта: именно она на 16 px опознаётся как шлем. -->
  <path d="M16 33 L5 51 Q32 58 59 51 L48 33 Z" fill="#4E5C66"/>
  <!-- Намёк на пластины-ламели; на 16 px сливается, живёт на 32+ -->
  <path d="M8 44 Q32 50.5 56 44" fill="none" stroke="#231F20" stroke-width="1.7" opacity=".5"/>

  <!-- Хати (鉢) — купол шлема -->
  <path d="M18 37 Q18 16 32 16 Q46 16 46 37 Z" fill="#96A3AC"/>
  <!-- Мабидзаси — козырёк над лицом -->
  <path d="M15 33 Q32 29 49 33 L49 37.5 Q32 33.5 15 37.5 Z" fill="#333E45"/>

  <!-- Кувагата (鍬形) — золотые рога-«мотыги», главный опознавательный
       знак кабуто. Расширяются к концам, как настоящие, и расходятся
       широко, чтобы не закрывать купол и не слипаться в «рюмку». -->
  <path d="M28 34 C23 28 15 20 9 12 L15 8 C21 16 28 25 32 32 Z" fill="#DCA300"/>
  <path d="M36 34 C41 28 49 20 55 12 L49 8 C43 16 36 25 32 32 Z" fill="#DCA300"/>
</svg>
